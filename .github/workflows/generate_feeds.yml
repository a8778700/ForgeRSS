# Generate RSS feeds on schedule
# Default: every 6 hours, configurable via repository variables

name: Generate Feeds

on:
  schedule:
    # Default: every 6 hours (0:00, 6:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Max articles per feed'
        required: false
        default: '50'
        type: string

env:
  LOG_LEVEL: INFO
  XIAOYUZHOU_PODCAST_ID: ${{ vars.XIAOYUZHOU_PODCAST_ID || '6a1eb1fa9d800e7a2ae98bfb' }}
  XIAOYUZHOU_DOWNLOAD_AUDIO: 'false'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feed generators
        run: python scripts/run_single.py xiaoyuzhou --max 15

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add feeds/*.xml cache/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update RSS feeds [skip ci]"
            git push
          fi
